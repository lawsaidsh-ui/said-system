{% extends "base.html" %}
{% block title %}{{ 'تعديل وكالة' if agency else 'وكالة جديدة' }}{% endblock %}
{% block content %}
<h2 class="page-title">{{ 'تعديل وكالة' if agency else 'وكالة جديدة' }}</h2>
{% if error is defined and error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form class="panel form-grid" method="post">
  <div class="form-section full">
    <h3 class="section-title">بيانات الوكالة</h3>
    <div class="form-grid">
      <div class="field">
        <label>رقم الوكالة</label>
        <input class="input" name="agency_number" required value="{{ agency.agency_number if agency else '' }}">
      </div>
      <div class="field">
        <label>عنوان الوكالة</label>
        <input class="input" name="title" required placeholder="مثال: وكالة حضور ومرافعة" value="{{ agency.title if agency else '' }}">
      </div>
      <div class="field">
        <label>الحالة</label>
        <select name="status">
          {% for key, val in agency_statuses.items() %}
            <option value="{{ key }}" {% if (agency and agency.status==key) or (not agency and key=='active') %}selected{% endif %}>{{ val }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>جهة التوثيق</label>
        <input class="input" name="notary_office" value="{{ agency.notary_office if agency else '' }}">
      </div>
      <div class="field">
        <label>المفوض/الوكيل</label>
        <input class="input" name="authorized_person" value="{{ agency.authorized_person if agency else '' }}">
      </div>
      <div class="field">
        <label>تاريخ الإصدار</label>
        <input class="input" type="date" name="issued_at" value="{{ agency.issued_at if agency and agency.issued_at else '' }}">
      </div>
      <div class="field">
        <label>تاريخ الانتهاء</label>
        <input class="input" type="date" name="expires_at" value="{{ agency.expires_at if agency and agency.expires_at else '' }}">
      </div>
    </div>
  </div>

  <div class="form-section full">
    <h3 class="section-title">الارتباط بالملف</h3>
    <div class="form-grid">
      <div class="field">
        <label>العميل</label>
        <select name="client_id" required data-client-filter-source="agency-form">
          <option value="">-- اختر العميل --</option>
          {% for client in clients %}
            <option value="{{ client.id }}" {% if agency and agency.client_id==client.id %}selected{% endif %}>{{ client.full_name }}{% if client.phone %} - {{ client.phone }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>القضية</label>
        <select name="matter_id" data-client-filter-target="agency-form" data-empty-without-client>
          <option value="">بدون قضية محددة</option>
          {% for matter in matters %}
            <option value="{{ matter.id }}" data-client-id="{{ matter.client_id }}" {% if agency and agency.matter_id==matter.id %}selected{% endif %}>{{ matter.case_number }} - {{ matter.title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>

  <div class="field full">
    <label>نطاق الوكالة</label>
    <textarea name="scope">{{ agency.scope if agency else '' }}</textarea>
  </div>
  <div class="field full">
    <label>ملاحظات</label>
    <textarea name="notes">{{ agency.notes if agency else '' }}</textarea>
  </div>
  <div class="actions full">
    <button class="btn btn-primary" data-confirm="تأكيد الحفظ؟" type="submit">حفظ</button>
    <a class="btn btn-secondary" href="/agencies">إلغاء</a>
  </div>
</form>
{% endblock %}
